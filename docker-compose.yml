services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Optional: public HTTPS links to CSVs (Vultr Object Storage, Drive direct link, etc.)
      SCOREBOARD_SCORED_URL: ${SCOREBOARD_SCORED_URL:-}
      SCOREBOARD_URL: ${SCOREBOARD_URL:-}
      BACKTEST_RESULTS_URL: ${BACKTEST_RESULTS_URL:-}
      BACKTEST_SUMMARY_URL: ${BACKTEST_SUMMARY_URL:-}
    volumes:
      # Supply datasets via mount and/or SCOREBOARD_*_URL download on boot.
      - ./data:/app/data
      - ./IBM/data:/app/IBM/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # On Vultr set this to http://YOUR_VPS_IP:8000 (or your domain).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
